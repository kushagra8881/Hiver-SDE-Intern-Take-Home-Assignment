[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spotify-support-agent"
version = "0.1.0"
description = "A leakage-aware, evidence-grounded support agent for SpotifyCares tweets"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<2",
  "pandas>=2.1,<3",
  "scikit-learn>=1.3,<2",
  "scipy>=1.10,<2",
  "joblib>=1.3,<2",
  "requests>=2.31,<3",
  "python-dotenv>=1,<2",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
support-agent = "hiver_support.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
